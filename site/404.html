<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #fafaf8;
      color: #1a1a18;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
    }

    p {
      font-size: 1.1em;
      color: #6b6966;
      margin-bottom: 2em;
    }

    a {
      display: inline-block;
      padding: 0.75em 1.5em;
      background: #1a1a18;
      color: #fafaf8;
      text-decoration: none;
      border-radius: 4px;
      font-size: 1em;
    }

    a:hover {
      background: #2a2a28;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Page not found</p>
    <a href="/">back to home</a>
  </div>
</body>
</html>
